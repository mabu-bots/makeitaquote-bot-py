[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makeitaquote-bot-py"
version = "1.0.0"
description = "Discord のメッセージや任意のテキストから名言風の捏造画像を生成する Bot（Python 版）"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "Pillow>=10,<12",
]

[tool.setuptools.packages.find]
include = ["makeitaquote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
