name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # pytest is a test-only tool, so install the runner explicitly here
      # instead of adding it to requirements.txt.
      - run: pip install pytest
      - run: python -m pytest
